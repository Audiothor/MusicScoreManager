site_name: Music Score Manager
site_description: Documentation officielle de Music Score Manager - Application moderne de gestion de partitions et setlists pour musiciens.
site_author: Audiothor
site_url: https://audiothor.github.io/MusicScoreManager/
repo_name: Audiothor/MusicScoreManager
repo_url: https://github.com/Audiothor/MusicScoreManager

theme:
  name: material
  language: fr
  palette:
    # Mode sombre par défaut
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    # Mode clair basculable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  alternate:
    - name: Français
      link: /MusicScoreManager/
      lang: fr
    - name: English
      link: /MusicScoreManager/en/
      lang: en

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_name: Music Score Manager
          site_description: Official documentation for Music Score Manager - Cross-platform music sheet & setlist management app for musicians.
          nav_translations:
            Accueil: Home
            Guide d'utilisation: User Guide
            Gestion des Partitions: Score Management
            Gestion des Setlists: Setlist Management
            Visualiseur & Concert: Viewer & Stage Mode
            Partage & Transfert sans fil: Wireless Sharing & Transfer
            Atelier d'assemblage PDF: PDF Assembler Studio
            Sauvegardes & Restauration: Backups & Restoration
            À propos & Confidentialité: About & Privacy
            Politique de confidentialité: Privacy Policy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list

nav:
  - Accueil: index.md
  - Guide d'utilisation:
      - Gestion des Partitions: guide/scores.md
      - Gestion des Setlists: guide/setlists.md
      - Visualiseur & Concert: guide/viewer.md
      - Partage & Transfert sans fil: guide/transfer.md
      - Atelier d'assemblage PDF: guide/pdf-assembler.md
      - Sauvegardes & Restauration: guide/backups.md
  - À propos & Confidentialité:
      - Politique de confidentialité: confidentialite.md
