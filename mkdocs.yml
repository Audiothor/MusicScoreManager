site_name: Music Score Manager
site_description: Documentation officielle et exhaustive de Music Score Manager - Guide complet de tous les menus et fonctionnalités.
site_author: Audiothor
site_url: https://audiothor.github.io/MusicScoreManager/
repo_name: Audiothor/MusicScoreManager
repo_url: https://github.com/Audiothor/MusicScoreManager

theme:
  name: material
  language: fr
  palette:
    # Mode sombre par défaut
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    # Mode clair basculable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  alternate:
    - name: Français
      link: /MusicScoreManager/
      lang: fr
    - name: English
      link: /MusicScoreManager/en/
      lang: en

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_name: Music Score Manager
          site_description: Comprehensive user guide and documentation for all menus and features in Music Score Manager.
          nav_translations:
            Accueil: Home
            Guide des Menus: Menu Guide
            Menu Partitions: Scores Menu
            Menu Setlists: Setlists Menu
            Visualiseur & Scène: Viewer & Stage Mode
            Menu Outils: Tools Menu
            Menu Paramètres: Settings Menu
            Menu Quitter: Quit Menu
            À propos & Confidentialité: About & Privacy
            Politique de confidentialité: Privacy Policy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list

nav:
  - Accueil: index.md
  - Guide des Menus:
      - Menu Partitions: guide/scores.md
      - Menu Setlists: guide/setlists.md
      - Visualiseur & Scène: guide/viewer.md
      - Menu Outils: guide/tools.md
      - Menu Paramètres: guide/settings.md
      - Menu Quitter: guide/quit.md
  - À propos & Confidentialité:
      - Politique de confidentialité: confidentialite.md
