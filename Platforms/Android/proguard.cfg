# ====================================================================
# MusicScoreManager - Configuration ProGuard / R8 pour Stabilité & Google Play
# ====================================================================

# Désactiver le renommage de classes pour préserver le pont JNI de .NET MAUI
-dontobfuscate

# Conservation des attributs et annotations requis pour le runtime .NET MAUI
-keepattributes *Annotation*
-keepattributes Signature
-keepattributes InnerClasses
-keepattributes EnclosingMethod
-keepattributes SourceFile
-keepattributes LineNumberTable

# Classes du runtime Xamarin / Mono / .NET Android
-keep class android.support.multidex.MultiDexApplication { <init>(); }
-keep class net.dot.jni.** { *; <init>(); }
-keep class mono.MonoRuntimeProvider* { *; <init>(...); }
-keep class mono.MonoPackageManager { *; <init>(...); }
-keep class mono.MonoPackageManager_Resources { *; <init>(...); }
-keep class mono.android.** { *; <init>(...); }
-keep class mono.java.** { *; <init>(...); }
-keep class mono.javax.** { *; <init>(...); }
-keep class net.dot.jni.ManagedPeer { *; <init>(...); }
-keep class com.xamarin.** { *; }
-keep class crc64** { *; }
-keep class com.microsoft.maui.** { *; }
-keep class android.runtime.** { <init>(...); }
-keep class assembly_mono_android.android.runtime.** { <init>(...); }
-keep class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keepclassmembers class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keep class net.dot.android.crypto.** { *; <init>(...); }

# Bibliothèques AndroidX & Google Material
-keep class androidx.** { *; }
-keep class com.google.android.material.** { *; }

# Vues Android (setters et constructeurs XML)
-keepclassmembers class * extends android.view.View {
   *** set*(...);
}
-keepclassmembers class * extends android.view.View {
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}

# Composants applicatifs (manifeste)
-keep class com.audiothor.musicscoremanager.** { *; }
-keep public class * extends android.app.Activity
-keep public class * extends android.app.Application
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider

# Avertissements
-dontwarn **
-ignorewarnings
