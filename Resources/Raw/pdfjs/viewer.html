<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer</title>
    <script src="pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: high-quality;
            background-color: #000;
        }
        
        /* Zones de clics transparentes */
        .tap-zone {
            position: absolute;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.001); /* Détection tactile fluide */
        }
        #left-zone {
            top: 0;
            left: 0;
            width: 30%;
            height: 80%;
        }
        #center-zone {
            top: 0;
            left: 30%;
            width: 40%;
            height: 80%;
        }
        #right-zone {
            top: 0;
            right: 0;
            width: 30%;
            height: 80%;
        }
        #bottom-zone {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20%;
        }
    </style>
</head>
<body>
    <div id="left-zone" class="tap-zone"></div>
    <div id="center-zone" class="tap-zone"></div>
    <div id="right-zone" class="tap-zone"></div>
    <div id="bottom-zone" class="tap-zone"></div>

    <canvas id="pdf-canvas"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let rotation = 0;
        const scale = 1.5;
        let currentRenderTask = null;
        const pageCache = new Map();

        let nextGesture = 'SwipeLeft';
        let prevGesture = 'SwipeRight';
        let twoPagesLandscape = true;
        let lastIsTwoPages = false;

        function setGestures(nextG, prevG) {
            if (nextG) nextGesture = nextG;
            if (prevG) prevGesture = prevG;
        }

        function isTwoPagesMode() {
            return twoPagesLandscape && (window.innerWidth > window.innerHeight);
        }

        function setTwoPagesLandscape(enabled) {
            twoPagesLandscape = enabled;
            renderedBitmapCache.clear();
            if (pdfDoc) renderPage(pageNum);
        }

        // Gestion ergonomique complète des gestes tactiles
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let isMultiTouch = false;
        let lastTap = 0;

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                isMultiTouch = true;
            } else {
                isMultiTouch = false;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTime = Date.now();
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                isMultiTouch = true;
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (isMultiTouch) return;
            const isZoomed = window.visualViewport && window.visualViewport.scale > 1.05;
            
            const touch = e.changedTouches ? e.changedTouches[0] : null;
            if (!touch) return;

            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const duration = Date.now() - touchStartTime;

            // 1. Détection de glissement (Swipe) si distance >= 35px et durée < 800ms
            if (!isZoomed && dist >= 35 && duration < 800) {
                let detectedGesture = '';
                if (Math.abs(dx) > Math.abs(dy)) {
                    detectedGesture = dx < 0 ? 'SwipeLeft' : 'SwipeRight';
                } else {
                    detectedGesture = dy < 0 ? 'SwipeUp' : 'SwipeDown';
                }

                if (detectedGesture === nextGesture) {
                    nextPage(e);
                    return;
                } else if (detectedGesture === prevGesture) {
                    prevPage(e);
                    return;
                }
            }

            // 2. Détection de tap si distance < 20px et durée courte < 350ms
            if (dist < 20 && duration < 350) {
                const width = window.innerWidth || document.documentElement.clientWidth;
                const height = window.innerHeight || document.documentElement.clientHeight;
                const x = touch.clientX;
                const y = touch.clientY;

                // Zone du bas (20% du bas) -> Annotations
                if (y > height * 0.8) {
                    onBottomZoneTapped(e);
                    return;
                }

                // Zone centrale (30% - 70%) -> Double tap pour ouvrir le menu central
                if (x >= width * 0.3 && x <= width * 0.7) {
                    const now = new Date().getTime();
                    const timesince = now - lastTap;
                    if (timesince < 300 && timesince > 0) {
                        openMenu(e);
                        lastTap = 0;
                    } else {
                        lastTap = now;
                    }
                    return;
                }

                // Taper à gauche (0% - 30%)
                if (x < width * 0.3) {
                    if (nextGesture === 'TapLeft') {
                        nextPage(e);
                    } else if (prevGesture === 'TapLeft') {
                        prevPage(e);
                    }
                    return;
                }

                // Taper à droite (70% - 100%)
                if (x > width * 0.7) {
                    if (nextGesture === 'TapRight') {
                        nextPage(e);
                    } else if (prevGesture === 'TapRight') {
                        prevPage(e);
                    }
                    return;
                }
            }
        }, { passive: false });

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let currentDocId = 0; // Identifiant de document incrémental pour invalider strictement les tâches de fond
        const renderedBitmapCache = new Map(); // Cache d'images Bitmap pré-rendues
        const pageRotations = new Map(); // Enregistrement de la rotation spécifique par numéro de page

        function getRotationForPage(num) {
            if (pageRotations.has(num)) {
                return pageRotations.get(num);
            }
            return rotation;
        }

        function setPageRotation(pNum, deg) {
            pageRotations.set(pNum, deg);
            renderedBitmapCache.clear();
            if (pdfDoc) {
                renderPage(pageNum);
            }
        }

        function setPageRotationsMap(rotMap) {
            pageRotations.clear();
            if (rotMap) {
                for (const [p, r] of Object.entries(rotMap)) {
                    pageRotations.set(parseInt(p, 10), parseInt(r, 10));
                }
            }
            renderedBitmapCache.clear();
            if (pdfDoc) {
                renderPage(pageNum);
            }
        }

        function setRotation(deg, applyToAll = false) {
            if (applyToAll) {
                rotation = deg;
                pageRotations.clear();
            } else {
                pageRotations.set(pageNum, deg);
            }
            renderedBitmapCache.clear();
            if (pdfDoc) renderPage(pageNum);
        }

        async function getCachedPage(num, docId) {
            if (docId !== currentDocId || !pdfDoc) return null;
            const cacheKey = `${docId}_${num}`;
            if (pageCache.has(cacheKey)) {
                return pageCache.get(cacheKey);
            }
            if (num < 1 || num > pdfDoc.numPages) return null;
            const pagePromise = pdfDoc.getPage(num);
            pageCache.set(cacheKey, pagePromise);
            return pagePromise;
        }

        async function prerenderPageBitmap(num, docId) {
            if (docId !== currentDocId || !pdfDoc || num < 1 || num > pdfDoc.numPages) return;

            if (isTwoPagesMode()) {
                const leftNum = (num % 2 === 0) ? (num - 1) : num;
                const rightNum = leftNum + 1;
                const cacheKey = `${docId}_spread_${leftNum}`;
                if (renderedBitmapCache.has(cacheKey)) return;

                try {
                    const leftPage = await getCachedPage(leftNum, docId);
                    if (!leftPage || docId !== currentDocId) return;
                    const leftRot = getRotationForPage(leftNum);
                    const leftVp = leftPage.getViewport({ scale: scale, rotation: leftRot });

                    let rightPage = null;
                    let rightVp = null;
                    if (rightNum <= pdfDoc.numPages) {
                        rightPage = await getCachedPage(rightNum, docId);
                        if (rightPage) {
                            const rightRot = getRotationForPage(rightNum);
                            rightVp = rightPage.getViewport({ scale: scale, rotation: rightRot });
                        }
                    }

                    const totalWidth = leftVp.width + (rightVp ? rightVp.width : leftVp.width);
                    const totalHeight = Math.max(leftVp.height, rightVp ? rightVp.height : leftVp.height);

                    const spreadCanvas = document.createElement('canvas');
                    spreadCanvas.width = totalWidth;
                    spreadCanvas.height = totalHeight;
                    const spreadCtx = spreadCanvas.getContext('2d');

                    spreadCtx.fillStyle = '#FFFFFF';
                    spreadCtx.fillRect(0, 0, totalWidth, totalHeight);

                    // Left page
                    const leftCanvas = document.createElement('canvas');
                    leftCanvas.width = leftVp.width;
                    leftCanvas.height = leftVp.height;
                    const leftTask = leftPage.render({
                        canvasContext: leftCanvas.getContext('2d'),
                        viewport: leftVp,
                        intent: 'display'
                    });
                    await leftTask.promise;
                    if (docId !== currentDocId) return;
                    spreadCtx.drawImage(leftCanvas, 0, 0);

                    // Right page
                    if (rightPage && rightVp) {
                        const rightCanvas = document.createElement('canvas');
                        rightCanvas.width = rightVp.width;
                        rightCanvas.height = rightVp.height;
                        const rightTask = rightPage.render({
                            canvasContext: rightCanvas.getContext('2d'),
                            viewport: rightVp,
                            intent: 'display'
                        });
                        await rightTask.promise;
                        if (docId !== currentDocId) return;
                        spreadCtx.drawImage(rightCanvas, leftVp.width, 0);
                    }

                    // Separator line
                    spreadCtx.strokeStyle = '#333333';
                    spreadCtx.lineWidth = 2;
                    spreadCtx.beginPath();
                    spreadCtx.moveTo(leftVp.width, 0);
                    spreadCtx.lineTo(leftVp.width, totalHeight);
                    spreadCtx.stroke();

                    if (docId === currentDocId) {
                        renderedBitmapCache.set(cacheKey, spreadCanvas);
                    }
                } catch (e) {}
            } else {
                const cacheKey = `${docId}_${num}`;
                if (renderedBitmapCache.has(cacheKey)) return;

                try {
                    const page = await getCachedPage(num, docId);
                    if (!page || docId !== currentDocId) return;

                    const pageRot = getRotationForPage(num);
                    const viewport = page.getViewport({ scale: scale, rotation: pageRot });
                    const offscreenCanvas = document.createElement('canvas');
                    offscreenCanvas.width = viewport.width;
                    offscreenCanvas.height = viewport.height;
                    const offCtx = offscreenCanvas.getContext('2d', { alpha: false });
                    
                    const renderTask = page.render({
                        canvasContext: offCtx,
                        viewport: viewport,
                        intent: 'display'
                    });
                    await renderTask.promise;
                    if (docId === currentDocId) {
                        renderedBitmapCache.set(cacheKey, offscreenCanvas);
                    }
                } catch (e) {}
            }
        }

        async function preloadAdjacentPages(currentNum, docId) {
            if (docId !== currentDocId || !pdfDoc) return;
            // Préchargement asynchrone non-bloquant des pages adjacentes en RAM
            setTimeout(async () => {
                try {
                    if (docId !== currentDocId || !pdfDoc) return;
                    if (isTwoPagesMode()) {
                        const leftNum = (currentNum % 2 === 0) ? (currentNum - 1) : currentNum;
                        if (leftNum + 2 <= pdfDoc.numPages) {
                            await prerenderPageBitmap(leftNum + 2, docId);
                        }
                        if (leftNum - 2 >= 1) {
                            await prerenderPageBitmap(leftNum - 2, docId);
                        }
                    } else {
                        if (currentNum + 1 <= pdfDoc.numPages) {
                            await prerenderPageBitmap(currentNum + 1, docId);
                        }
                        if (currentNum - 1 >= 1) {
                            await prerenderPageBitmap(currentNum - 1, docId);
                        }
                        if (currentNum + 2 <= pdfDoc.numPages) {
                            await prerenderPageBitmap(currentNum + 2, docId);
                        }
                        if (currentNum - 2 >= 1) {
                            await prerenderPageBitmap(currentNum - 2, docId);
                        }
                    }
                } catch (e) {}
            }, 30);
        }

        const docCache = new Map(); // Cache d'objets PDF en mémoire (url -> pdfDoc)

        async function preloadPdf(source) {
            if (!source || docCache.has(source)) return;
            try {
                const loadingTask = pdfjsLib.getDocument({
                    url: source,
                    cMapUrl: 'cmaps/',
                    cMapPacked: true,
                    enableXfa: false,
                    disableAutoFetch: true,
                    disableStream: true
                });
                const doc = await loadingTask.promise;
                docCache.set(source, doc);
            } catch (e) {}
        }

        async function loadPdf(source, initialRotation = 0, initialPage = 1) {
            try {
                currentDocId++; // Nouveau document : invalide toutes les opérations asynchrones précédentes
                const activeDocId = currentDocId;

                if (currentRenderTask) {
                    try { currentRenderTask.cancel(); } catch (e) {}
                    currentRenderTask = null;
                }

                if (initialRotation !== undefined) rotation = parseInt(initialRotation, 10) || 0;

                pageCache.clear();
                renderedBitmapCache.clear();
                lastIsTwoPages = isTwoPagesMode();
                
                if (docCache.has(source)) {
                    pdfDoc = docCache.get(source);
                } else {
                    let loadingTask;
                    if (typeof source === 'string' && source.toLowerCase().endsWith('.pdf')) {
                        loadingTask = pdfjsLib.getDocument({
                            url: source,
                            cMapUrl: 'cmaps/',
                            cMapPacked: true,
                            enableXfa: false,
                            disableAutoFetch: true,
                            disableStream: true
                        });
                    } else {
                        const pdfData = atob(source);
                        const uint8Array = new Uint8Array(pdfData.length);
                        for (let i = 0; i < pdfData.length; i++) {
                            uint8Array[i] = pdfData.charCodeAt(i);
                        }
                        loadingTask = pdfjsLib.getDocument({ data: uint8Array });
                    }
                    pdfDoc = await loadingTask.promise;
                    if (typeof source === 'string') docCache.set(source, pdfDoc);
                }

                if (activeDocId !== currentDocId) return; // Annulé par un autre chargement plus récent

                if (initialPage === 'last' || initialPage === -1 || initialPage === 'end') {
                    if (isTwoPagesMode()) {
                        pageNum = (pdfDoc.numPages % 2 === 0) ? (pdfDoc.numPages - 1) : pdfDoc.numPages;
                        if (pageNum < 1) pageNum = 1;
                    } else {
                        pageNum = pdfDoc.numPages;
                    }
                } else {
                    pageNum = parseInt(initialPage, 10) || 1;
                    if (pageNum < 1 || pageNum > pdfDoc.numPages) pageNum = 1;
                    if (isTwoPagesMode()) {
                        pageNum = (pageNum % 2 === 0) ? (pageNum - 1) : pageNum;
                    }
                }

                await renderPage(pageNum);
                return "SUCCESS";
            } catch (error) {
                console.error("Erreur chargement PDF: ", error);
                return "ERROR: " + error.message;
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) return;
            const activeDocId = currentDocId;

            if (isTwoPagesMode()) {
                const leftNum = (num % 2 === 0) ? (num - 1) : num;
                const rightNum = leftNum + 1;
                pageNum = leftNum;
                const cacheKey = `${activeDocId}_spread_${leftNum}`;

                if (renderedBitmapCache.has(cacheKey)) {
                    const cachedCanvas = renderedBitmapCache.get(cacheKey);
                    canvas.width = cachedCanvas.width;
                    canvas.height = cachedCanvas.height;
                    ctx.drawImage(cachedCanvas, 0, 0);
                    
                    reportPageInfo();
                    preloadAdjacentPages(leftNum, activeDocId);

                    window.location.href = 'app://musicscore/ready';
                    return;
                }

                if (currentRenderTask) {
                    try { currentRenderTask.cancel(); } catch (e) {}
                    currentRenderTask = null;
                }

                window.location.href = 'app://musicscore/rendering';

                try {
                    const leftPage = await getCachedPage(leftNum, activeDocId);
                    if (!leftPage || activeDocId !== currentDocId) return;
                    const leftRot = getRotationForPage(leftNum);
                    const leftVp = leftPage.getViewport({ scale: scale, rotation: leftRot });

                    let rightPage = null;
                    let rightVp = null;
                    if (rightNum <= pdfDoc.numPages) {
                        rightPage = await getCachedPage(rightNum, activeDocId);
                        if (rightPage) {
                            const rightRot = getRotationForPage(rightNum);
                            rightVp = rightPage.getViewport({ scale: scale, rotation: rightRot });
                        }
                    }

                    const totalWidth = leftVp.width + (rightVp ? rightVp.width : leftVp.width);
                    const totalHeight = Math.max(leftVp.height, rightVp ? rightVp.height : leftVp.height);

                    // Double-buffering offscreen
                    const spreadCanvas = document.createElement('canvas');
                    spreadCanvas.width = totalWidth;
                    spreadCanvas.height = totalHeight;
                    const spreadCtx = spreadCanvas.getContext('2d');

                    spreadCtx.fillStyle = '#FFFFFF';
                    spreadCtx.fillRect(0, 0, totalWidth, totalHeight);

                    // Rendu page gauche
                    const leftCanvas = document.createElement('canvas');
                    leftCanvas.width = leftVp.width;
                    leftCanvas.height = leftVp.height;
                    currentRenderTask = leftPage.render({
                        canvasContext: leftCanvas.getContext('2d'),
                        viewport: leftVp,
                        intent: 'display'
                    });
                    await currentRenderTask.promise;
                    currentRenderTask = null;
                    if (activeDocId !== currentDocId) return;
                    spreadCtx.drawImage(leftCanvas, 0, 0);

                    // Rendu page droite (si elle existe)
                    if (rightPage && rightVp) {
                        const rightCanvas = document.createElement('canvas');
                        rightCanvas.width = rightVp.width;
                        rightCanvas.height = rightVp.height;
                        currentRenderTask = rightPage.render({
                            canvasContext: rightCanvas.getContext('2d'),
                            viewport: rightVp,
                            intent: 'display'
                        });
                        await currentRenderTask.promise;
                        currentRenderTask = null;
                        if (activeDocId !== currentDocId) return;
                        spreadCtx.drawImage(rightCanvas, leftVp.width, 0);
                    } else {
                        spreadCtx.fillStyle = '#FFFFFF';
                        spreadCtx.fillRect(leftVp.width, 0, leftVp.width, totalHeight);
                    }

                    // Séparateur vertical
                    spreadCtx.strokeStyle = '#333333';
                    spreadCtx.lineWidth = 2;
                    spreadCtx.beginPath();
                    spreadCtx.moveTo(leftVp.width, 0);
                    spreadCtx.lineTo(leftVp.width, totalHeight);
                    spreadCtx.stroke();

                    // Blit instantané sur le canvas visible
                    canvas.width = totalWidth;
                    canvas.height = totalHeight;
                    ctx.drawImage(spreadCanvas, 0, 0);

                    renderedBitmapCache.set(cacheKey, spreadCanvas);

                    reportPageInfo();
                    preloadAdjacentPages(leftNum, activeDocId);

                    window.location.href = 'app://musicscore/ready';
                } catch (err) {
                    if (err && err.name === 'RenderingCancelledException') return;
                    console.error("Erreur rendu 2 pages: ", err);
                }
            } else {
                pageNum = num;
                const cacheKey = `${activeDocId}_${num}`;

                if (renderedBitmapCache.has(cacheKey)) {
                    const cachedCanvas = renderedBitmapCache.get(cacheKey);
                    canvas.width = cachedCanvas.width;
                    canvas.height = cachedCanvas.height;
                    ctx.drawImage(cachedCanvas, 0, 0);
                    
                    reportPageInfo();
                    preloadAdjacentPages(num, activeDocId);

                    window.location.href = 'app://musicscore/ready';
                    return;
                }
                
                if (currentRenderTask) {
                    try { currentRenderTask.cancel(); } catch (e) {}
                    currentRenderTask = null;
                }

                window.location.href = 'app://musicscore/rendering';
                
                try {
                    const page = await getCachedPage(num, activeDocId);
                    if (!page || activeDocId !== currentDocId) return;

                    const pageRot = getRotationForPage(num);
                    const viewport = page.getViewport({ scale: scale, rotation: pageRot });

                    // Double-buffering offscreen : élimine complètement le balayage progressif à l'écran
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = viewport.width;
                    offCanvas.height = viewport.height;
                    const offCtx = offCanvas.getContext('2d', { alpha: false });

                    currentRenderTask = page.render({
                        canvasContext: offCtx,
                        viewport: viewport,
                        intent: 'display'
                    });
                    await currentRenderTask.promise;
                    currentRenderTask = null;

                    if (activeDocId !== currentDocId) return;

                    // Affichage atomique en 1 frame
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    ctx.drawImage(offCanvas, 0, 0);

                    renderedBitmapCache.set(cacheKey, offCanvas);

                    reportPageInfo();
                    preloadAdjacentPages(num, activeDocId);

                    window.location.href = 'app://musicscore/ready';
                } catch (err) {
                    if (err && err.name === 'RenderingCancelledException') return;
                    console.error("Erreur rendu page: ", err);
                }
            }
        }

        function reportPageInfo() {
            if (!pdfDoc) return;
            const rect = canvas.getBoundingClientRect();
            const vw = window.innerWidth || 1;
            const vh = window.innerHeight || 1;
            const cx = Math.max(0, rect.left / vw);
            const cy = Math.max(0, rect.top / vh);
            const cw = Math.min(1, rect.width / vw);
            const ch = Math.min(1, rect.height / vh);

            if (isTwoPagesMode()) {
                const leftNum = (pageNum % 2 === 0) ? (pageNum - 1) : pageNum;
                const rightNum = leftNum + 1;
                const hasRight = (rightNum <= pdfDoc.numPages) ? 1 : 0;
                const display = hasRight ? `${leftNum}-${rightNum}` : `${leftNum}`;
                window.location.href = `app://musicscore/pageinfo?max=${pdfDoc.numPages}&current=${leftNum}&displayCurrent=${display}&twoPages=1&leftPage=${leftNum}&rightPage=${rightNum}&hasRight=${hasRight}&cx=${cx.toFixed(4)}&cy=${cy.toFixed(4)}&cw=${cw.toFixed(4)}&ch=${ch.toFixed(4)}`;
            } else {
                window.location.href = `app://musicscore/pageinfo?max=${pdfDoc.numPages}&current=${pageNum}&displayCurrent=${pageNum}&twoPages=0&leftPage=${pageNum}&rightPage=${pageNum}&hasRight=0&cx=${cx.toFixed(4)}&cy=${cy.toFixed(4)}&cw=${cw.toFixed(4)}&ch=${ch.toFixed(4)}`;
            }
        }

        function prevPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc) return;

            if (isTwoPagesMode()) {
                const leftNum = (pageNum % 2 === 0) ? (pageNum - 1) : pageNum;
                if (leftNum <= 1) {
                    window.location.href = 'app://musicscore/start';
                    return;
                }
                pageNum = leftNum - 2;
                if (pageNum < 1) pageNum = 1;
                renderPage(pageNum);
            } else {
                if (pageNum <= 1) {
                    window.location.href = 'app://musicscore/start';
                    return;
                }
                pageNum--;
                renderPage(pageNum);
            }
        }

        function nextPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc) return;

            if (isTwoPagesMode()) {
                const leftNum = (pageNum % 2 === 0) ? (pageNum - 1) : pageNum;
                if (leftNum + 2 > pdfDoc.numPages) {
                    window.location.href = 'app://musicscore/end';
                    return;
                }
                pageNum = leftNum + 2;
                renderPage(pageNum);
            } else {
                if (pageNum >= pdfDoc.numPages) {
                    window.location.href = 'app://musicscore/end';
                    return;
                }
                pageNum++;
                renderPage(pageNum);
            }
        }

        function goToPage(num) {
            if (!pdfDoc) return;
            if (num >= 1 && num <= pdfDoc.numPages) {
                if (isTwoPagesMode()) {
                    pageNum = (num % 2 === 0) ? (num - 1) : num;
                } else {
                    pageNum = num;
                }
                renderPage(pageNum);
            }
        }

        function openMenu(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            window.location.href = 'app://musicscore/menu?max=' + (pdfDoc ? pdfDoc.numPages : 1) + '&current=' + pageNum;
        }

        function onBottomZoneTapped(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            window.location.href = 'app://musicscore/annotations';
        }

        window.addEventListener('resize', function() {
            const currentMode = isTwoPagesMode();
            if (currentMode !== lastIsTwoPages) {
                lastIsTwoPages = currentMode;
                renderedBitmapCache.clear();
                if (pdfDoc) {
                    renderPage(pageNum);
                }
            }
        });

        // Auto-chargement au démarrage avec support du paramètre rot, page & pageRots
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            const rot = urlParams.get('rot') || 0;
            const page = urlParams.get('page') || 1;
            const twoPagesParam = urlParams.get('twoPages');
            if (twoPagesParam !== null) {
                twoPagesLandscape = twoPagesParam !== 'false';
            }
            lastIsTwoPages = isTwoPagesMode();

            const pageRotsParam = urlParams.get('pageRots');
            if (pageRotsParam) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(pageRotsParam));
                    for (const [p, r] of Object.entries(parsed)) {
                        pageRotations.set(parseInt(p, 10), parseInt(r, 10));
                    }
                } catch (e) {
                    console.error("Erreur parsing pageRots:", e);
                }
            }

            const nextG = urlParams.get('nextGest');
            const prevG = urlParams.get('prevGest');
            if (nextG) nextGesture = nextG;
            if (prevG) prevGesture = prevG;

            if (file) {
                loadPdf(file, rot, page);
            }
        };
    </script>
</body>
