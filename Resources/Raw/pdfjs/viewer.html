<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PDF Viewer</title>
    <script src="pdf.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
        
        /* Zones de clics transparentes */
        .tap-zone {
            position: absolute;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.01); /* Forcer la détection tactile */
        }
        #left-zone {
            top: 0;
            left: 0;
            width: 30%;
            height: 80%;
        }
        #center-zone {
            top: 0;
            left: 30%;
            width: 40%;
            height: 80%;
        }
        #right-zone {
            top: 0;
            right: 0;
            width: 30%;
            height: 80%;
        }
        #bottom-zone {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20%;
        }
    </style>
</head>
<body>
    <div id="left-zone" class="tap-zone" onclick="prevPage(event)" ontouchend="prevPage(event)"></div>
    <div id="center-zone" class="tap-zone" onclick="openMenu(event)" ontouchend="openMenu(event)"></div>
    <div id="right-zone" class="tap-zone" onclick="nextPage(event)" ontouchend="nextPage(event)"></div>
    <div id="bottom-zone" class="tap-zone" onclick="onBottomZoneTapped(event)" ontouchend="onBottomZoneTapped(event)"></div>

    <canvas id="pdf-canvas"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let rotation = 0;
        const scale = 2.0;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        function setRotation(deg) {
            rotation = deg;
            renderPage(pageNum);
        }

        async function loadPdf(base64Data) {
            try {
                const pdfData = atob(base64Data);
                const uint8Array = new Uint8Array(pdfData.length);
                for (let i = 0; i < pdfData.length; i++) {
                    uint8Array[i] = pdfData.charCodeAt(i);
                }

                const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
                pdfDoc = await loadingTask.promise;
                
                pageNum = 1;
                await renderPage(pageNum);
                return "SUCCESS";
            } catch (error) {
                console.error("Erreur chargement PDF: ", error);
                return "ERROR: " + error.message;
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) return;
            
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale, rotation: rotation });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            await page.render(renderContext).promise;
            reportPageInfo();
        }

        function reportPageInfo() {
            // Notifier le C# du changement de page pour l'indicateur xx/yy
            window.location.href = 'app://musicscore/pageinfo?max=' + (pdfDoc ? pdfDoc.numPages : 1) + '&current=' + pageNum;
        }

        function prevPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc || pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        }

        function nextPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        }

        function goToPage(num) {
            if (!pdfDoc) return;
            if (num >= 1 && num <= pdfDoc.numPages) {
                pageNum = num;
                renderPage(pageNum);
            }
        }

        function openMenu(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            window.location.href = 'app://musicscore/menu?max=' + (pdfDoc ? pdfDoc.numPages : 1) + '&current=' + pageNum;
        }

        function onBottomZoneTapped(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            // Placeholder pour les annotations futures
            console.log("Bottom zone tapped - Annotations mode coming soon");
        }
    </script>
</body>
</html>
