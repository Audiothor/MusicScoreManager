<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PDF Viewer</title>
    <script src="pdf.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: high-quality;
        }
        
        /* Zones de clics transparentes */
        .tap-zone {
            position: absolute;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.01); /* Forcer la détection tactile */
        }
        #left-zone {
            top: 0;
            left: 0;
            width: 30%;
            height: 80%;
        }
        #center-zone {
            top: 0;
            left: 30%;
            width: 40%;
            height: 80%;
        }
        #right-zone {
            top: 0;
            right: 0;
            width: 30%;
            height: 80%;
        }
        #bottom-zone {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20%;
        }
    </style>
</head>
<body>
    <div id="left-zone" class="tap-zone"></div>
    <div id="center-zone" class="tap-zone"></div>
    <div id="right-zone" class="tap-zone"></div>
    <div id="bottom-zone" class="tap-zone"></div>

    <canvas id="pdf-canvas"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let rotation = 0;
        const scale = 1.5; // Optimisé pour réduire de 44% l'occupation mémoire (évite les crashs OOM)

        // Gestion de filtrage intelligent des gestes tactiles
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let isMultiTouch = false;
        let wasTouchHandled = false;

        document.addEventListener('touchstart', function(e) {
            wasTouchHandled = false;
            if (e.touches.length > 1) {
                isMultiTouch = true;
            } else {
                isMultiTouch = false;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTime = Date.now();
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                isMultiTouch = true;
            }
        }, { passive: true });

        let lastTap = 0;

        function handleZoneTap(zoneName, e) {
            if (isMultiTouch) return;
            // Si le zoom du viewport est actif, on ignore les zones de navigation gauche/droite pour éviter les sauts involontaires
            const isZoomed = window.visualViewport && window.visualViewport.scale > 1.05;
            if (isZoomed && (zoneName === 'left' || zoneName === 'right')) {
                return;
            }

            const duration = Date.now() - touchStartTime;
            if (duration > 300) return; // appui long ignoré

            if (e && e.changedTouches && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 15) {
                    return; // drag/glissement, ignoré
                }
            }

            if (zoneName === 'left') {
                prevPage(e);
            } else if (zoneName === 'right') {
                nextPage(e);
            } else if (zoneName === 'bottom') {
                onBottomZoneTapped(e);
            } else if (zoneName === 'center') {
                const now = new Date().getTime();
                const timesince = now - lastTap;
                if ((timesince < 300) && (timesince > 0)) {
                    openMenu(e);
                }
                lastTap = now;
            }
        }

        function bindZone(id, zoneName) {
            const el = document.getElementById(id);
            if (!el) return;

            el.addEventListener('touchend', function(e) {
                wasTouchHandled = true;
                handleZoneTap(zoneName, e);
            });

            el.addEventListener('click', function(e) {
                if (wasTouchHandled) {
                    wasTouchHandled = false; // reset
                    return;
                }
                handleZoneTap(zoneName, e);
            });
        }

        bindZone('left-zone', 'left');
        bindZone('center-zone', 'center');
        bindZone('right-zone', 'right');
        bindZone('bottom-zone', 'bottom');

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        function setRotation(deg) {
            rotation = deg;
            renderPage(pageNum);
        }

        async function loadPdf(source) {
            try {
                let loadingTask;
                
                // Si la source se termine par .pdf, on charge par URL (Direct File Access)
                if (typeof source === 'string' && source.toLowerCase().endsWith('.pdf')) {
                    loadingTask = pdfjsLib.getDocument(source);
                } else {
                    // Sinon on traite comme du Base64 (Ancienne méthode / Fallback)
                    const pdfData = atob(source);
                    const uint8Array = new Uint8Array(pdfData.length);
                    for (let i = 0; i < pdfData.length; i++) {
                        uint8Array[i] = pdfData.charCodeAt(i);
                    }
                    loadingTask = pdfjsLib.getDocument({ data: uint8Array });
                }

                pdfDoc = await loadingTask.promise;
                pageNum = 1;
                await renderPage(pageNum);
                return "SUCCESS";
            } catch (error) {
                console.error("Erreur chargement PDF: ", error);
                return "ERROR: " + error.message;
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) return;
            
            // Signaler au C# que le rendu commence (pour masquer les annotations temporairement)
            window.location.href = 'app://musicscore/rendering';
            
            const page = await pdfDoc.getPage(num);
            
            // Calculer le viewport à l'échelle demandée
            // On ajoute la rotation demandée par l'utilisateur à la rotation native du PDF
            const viewport = page.getViewport({ scale: scale, rotation: rotation });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            // Optionnel: On peut ajuster le scale dynamiquement ici si besoin
            
            const renderContext = {
                canvasContext: ctx,
                viewport: viewport,
                enableWebGL: true
            };

            // Nettoyage du contexte avant nouveau rendu
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            await page.render(renderContext).promise;
            reportPageInfo();

            // Signaler que le PDF est prêt (pour le métronome)
            if (num === 1) {
                window.location.href = 'app://musicscore/ready';
            }
        }

        function reportPageInfo() {
            // Notifier le C# du changement de page pour l'indicateur xx/yy
            window.location.href = 'app://musicscore/pageinfo?max=' + (pdfDoc ? pdfDoc.numPages : 1) + '&current=' + pageNum;
        }

        function prevPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc) return;
            if (pageNum <= 1) {
                window.location.href = 'app://musicscore/start';
                return;
            }
            pageNum--;
            renderPage(pageNum);
        }

        function nextPage(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!pdfDoc) return;
            if (pageNum >= pdfDoc.numPages) {
                window.location.href = 'app://musicscore/end';
                return;
            }
            pageNum++;
            renderPage(pageNum);
        }

        function goToPage(num) {
            if (!pdfDoc) return;
            if (num >= 1 && num <= pdfDoc.numPages) {
                pageNum = num;
                renderPage(pageNum);
            }
        }

        function openMenu(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            window.location.href = 'app://musicscore/menu?max=' + (pdfDoc ? pdfDoc.numPages : 1) + '&current=' + pageNum;
        }

        function onBottomZoneTapped(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            window.location.href = 'app://musicscore/annotations';
        }

        // Auto-chargement au démarrage si un paramètre 'file' est présent
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            if (file) {
                console.log("Auto-loading PDF from URL param: " + file);
                loadPdf(file);
            }
        };
    </script>
</body>
</html>
